<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Hub | Reset Password</title>
    <style>
        :root {
            --ink: #14212b;
            --muted: #6b7b86;
            --line: #d9e2e7;
            --surface: #ffffff;
            --canvas: #f4f8fa;
            --brand: #117aa3;
            --brand-dark: #0d6387;
            --brand-soft: #e7f4f8;
            --error: #b42318;
            --success: #16794b;
            --shadow: 0 24px 70px rgba(25, 52, 67, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: var(--ink);
            background:
                radial-gradient(circle at 20% 10%, rgba(17, 122, 163, 0.09), transparent 30%),
                linear-gradient(135deg, #f8fbfc 0%, var(--canvas) 58%, #eef5f7 100%);
            font-family: Georgia, "Times New Roman", serif;
            padding: 16px;
        }

        .auth-shell {
            width: min(100%, 430px);
            animation: rise-in 500ms ease both;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
            color: var(--brand-dark);
            font: 700 15px/1.2 Arial, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand-mark {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            color: white;
            background: var(--brand);
            border-radius: 8px;
            box-shadow: 0 7px 16px rgba(17, 122, 163, 0.2);
            font-size: 16px;
        }

        .card {
            position: relative;
            padding: 36px 32px 30px;
            background: var(--surface);
            border: 1px solid rgba(167, 187, 197, 0.7);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .card h1 {
            margin: 4px 0 10px;
            text-align: center;
            font-size: 26px;
            font-weight: 600;
        }

        .card p.subtitle {
            text-align: center;
            color: var(--muted);
            font: 14px Arial, sans-serif;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--ink);
            font-weight: 500;
            font-size: 13px;
            font-family: Arial, sans-serif;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font: 14px Arial, sans-serif;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(17, 122, 163, 0.12);
        }

        .primary-button {
            width: 100%;
            height: 44px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 8px;
            font: 600 14px Arial, sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .primary-button:hover {
            background: var(--brand-dark);
        }

        .primary-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 11px 12px;
            margin-bottom: 16px;
            border-radius: 7px;
            font: 13px/1.4 Arial, sans-serif;
        }

        .message.visible {
            display: block;
        }

        .message.error {
            color: var(--error);
            background: #fef2f2;
            border: 1px solid #fac8c4;
        }

        .message.success {
            color: var(--success);
            background: #edf9f2;
            border: 1px solid #b9e4c9;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--brand);
            text-decoration: none;
            font: 13px Arial, sans-serif;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <main class="auth-shell">
        <div class="brand"><span class="brand-mark">P</span> Project Hub</div>

        <section class="card">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your new password below</p>

            <div class="message" id="message-box"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <div class="input-wrap">
                        <input id="new-password" type="password" placeholder="At least 8 characters" required minlength="8" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-wrap">
                        <input id="confirm-password" type="password" placeholder="Confirm your password" required minlength="8" />
                    </div>
                </div>

                <button class="primary-button" type="submit" id="submit-btn">Update Password</button>
            </form>

            <a href="index.html" class="back-link">Back to login</a>
        </section>
    </main>

    <script src="supabase.js"></script>
    <script src="/api/public-config"></script>
    <script src="config.js"></script>
    <script>
        const runtimeConfig = window.getSupabaseConfig ? window.getSupabaseConfig() : (window.__PROJECT_HUB_CONFIG__ || {});
        const SUPABASE_URL = runtimeConfig.url || '';
        const SUPABASE_ANON_KEY = runtimeConfig.anonKey || '';
        const db = SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        const form = document.getElementById('reset-form');
        const messageBox = document.getElementById('message-box');
        const submitBtn = document.getElementById('submit-btn');

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = `message visible ${type}`;
        }

        function showInvalidLink() {
            showMessage('This reset link is invalid or has expired.', 'error');
            form.style.display = 'none';
            // Show a "request new link" button
            const backLink = document.querySelector('.back-link');
            if (backLink) {
                const newBtn = document.createElement('a');
                newBtn.href = 'index.html#forgot';
                newBtn.className = 'back-link';
                newBtn.style.marginTop = '12px';
                newBtn.textContent = '→ Request a new reset link';
                backLink.insertAdjacentElement('afterend', newBtn);
            }
        }

        async function initResetPage() {
            // --- Strategy 1: PKCE flow — token_hash in query params ---
            const queryParams = new URLSearchParams(window.location.search);
            const token_hash = queryParams.get('token_hash');
            const queryType = queryParams.get('type');

            if (token_hash && queryType === 'recovery') {
                try {
                    const { error } = await db.auth.verifyOtp({ token_hash, type: 'recovery' });
                    if (error) {
                        console.error('verifyOtp error:', error.message);
                        showInvalidLink();
                        return;
                    }
                    // Token verified — clean URL and show form
                    history.replaceState(null, '', window.location.pathname);
                    showMessage('✓ Link verified. Enter your new password below.', 'success');
                } catch (err) {
                    console.error('verifyOtp exception:', err);
                    showInvalidLink();
                }
                return;
            }

            // --- Strategy 2: Implicit flow — tokens in URL hash fragment ---
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = hashParams.get('access_token');
            const refreshToken = hashParams.get('refresh_token');
            const hashType = hashParams.get('type');

            if (accessToken && hashType === 'recovery') {
                try {
                    // Set the session directly from the tokens in the hash
                    const { error } = await db.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    if (error) {
                        console.error('setSession error:', error.message);
                        showInvalidLink();
                        return;
                    }
                    // Clean the hash from URL
                    history.replaceState(null, '', window.location.pathname);
                    showMessage('✓ Link verified. Enter your new password below.', 'success');
                } catch (err) {
                    console.error('setSession exception:', err);
                    showInvalidLink();
                }
                return;
            }

            // --- No valid token found ---
            showInvalidLink();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password.length < 8) {
                showMessage('Password must be at least 8 characters.', 'error');
                return;
            }

            if (password !== confirm) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating...';

            try {
                const { error } = await db.auth.updateUser({ password });

                if (error) {
                    showMessage(error.message, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Update Password';
                } else {
                    // Sign out after reset so the user logs in fresh with new password
                    await db.auth.signOut();
                    showMessage('✓ Password updated! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
            } catch (err) {
                showMessage(err.message || 'Failed to update password. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password';
            }
        });

        initResetPage();
    </script>
</body>

</html>
