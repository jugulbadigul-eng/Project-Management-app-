<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestones - Project Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https//fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #0c2d48;
            --sidebar-hover: #145da0;
            --sidebar-active: #0e86d4;
            --sidebar-text: #b1d4e0;
            --sidebar-text-active: #ffffff;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-sub: #94a3b8;
            --primary: #0b5d73;
            --primary-hover: #08495a;
            --success: #16a34a;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        /* Ã¢â€â‚¬Ã¢â€â‚¬ Sidebar Ã¢â€â‚¬Ã¢â€â‚¬ */
        aside.sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 100vh;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 50;
            transition: margin-left 0.25s ease, transform 0.25s ease;
        }

        aside.sidebar.closed {
            margin-left: -260px;
        }

        .sidebar-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .sidebar-header-row .back-projects-link {
            margin-bottom: 0;
        }


        /* Sits directly on the edge/border of the sidebar */
        .sidebar-edge-toggle {
            position: fixed;
            top: 22px;
            left: 246px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--sidebar-bg);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            color: var(--sidebar-text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 60;
            transition: left 0.25s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .sidebar-edge-toggle:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .sidebar-edge-toggle svg {
            transition: transform 0.25s ease;
        }

        /* When sidebar is closed, button moves to the left edge and flips direction */
        .sidebar-edge-toggle.closed {
            left: 12px;
            background-color: #1e293b;
            color: #ffffff;
        }

        .sidebar-edge-toggle.closed svg {
            transform: rotate(180deg);
        }

        .sidebar-backdrop {
            display: none;
        }

        .sidebar-top {
            padding: 24px 20px;
        }

        .back-projects-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 18px;
            transition: color 0.2s ease;
        }

        .back-projects-link:hover {
            color: #cbd5e1;
        }

        .sidebar-brand {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 28px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
        }

        .nav-item a svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            opacity: 0.8;
        }

        .nav-item a:hover {
            color: #ffffff;
            background-color: var(--sidebar-hover);
        }

        .nav-item.active a {
            color: var(--sidebar-text-active);
            background-color: var(--sidebar-active);
            font-weight: 600;
        }

        .nav-item.active a svg {
            opacity: 1;
        }

        .sidebar-bottom {
            padding: 18px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .avatar {
            width: 34px;
            height: 34px;
            background-color: #334155;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }

        .user-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #f1f5f9;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-sidebar-logout {
            background: none;
            border: none;
            color: var(--sidebar-text);
            cursor: pointer;
            padding: 6px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }

        .btn-sidebar-logout:hover {
            color: #ef4444;
        }

        .btn-sidebar-logout svg {
            width: 18px;
            height: 18px;
        }

        /* Ã¢â€â‚¬Ã¢â€â‚¬ Main Content Ã¢â€â‚¬Ã¢â€â‚¬ */
        main.main-content {
            flex: 1;
            padding: 36px 48px 60px;
            min-width: 0;
            overflow-y: auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .btn-add-milestone {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .btn-add-milestone:hover {
            background-color: var(--primary-hover);
        }

        .btn-add-milestone:active {
            transform: scale(0.98);
        }

        /* Ã¢â€â‚¬Ã¢â€â‚¬ Timeline Card Container Ã¢â€â‚¬Ã¢â€â‚¬ */
        .milestones-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-card);
            max-width: 900px;
        }

        .timeline-list {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .timeline-item {
            display: flex;
            gap: 20px;
            position: relative;
            padding-bottom: 36px;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        /* Connecting vertical line */
        .timeline-item:not(:last-child)::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 26px;
            bottom: 0;
            width: 2px;
            background-color: #cbd5e1;
        }

        .timeline-status-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            z-index: 2;
            background: #ffffff;
        }

        .circle-pending {
            width: 20px;
            height: 20px;
            border: 2px solid #94a3b8;
            border-radius: 50%;
            transition: border-color 0.15s ease, transform 0.15s ease;
        }

        .circle-pending:hover {
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .circle-completed {
            width: 20px;
            height: 20px;
            border: 2px solid var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--success);
            transition: transform 0.15s ease;
        }

        .circle-completed:hover {
            transform: scale(1.1);
        }

        .circle-completed svg {
            width: 12px;
            height: 12px;
            stroke-width: 3;
        }

        .timeline-content {
            flex: 1;
            padding-top: 1px;
        }

        .timeline-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 4px;
        }

        .timeline-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .timeline-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.15s ease;
        }

        .btn-action svg {
            width: 16px;
            height: 16px;
        }

        .btn-action.edit:hover {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .btn-action.delete:hover {
            background-color: #fee2e2;
            color: #ef4444;
        }

        .timeline-item.completed .timeline-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .timeline-date {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .timeline-desc {
            font-size: 13.5px;
            color: #475569;
            line-height: 1.5;
        }

        .empty-milestones {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Ã¢â€â‚¬Ã¢â€â‚¬ Modal Overlay Ã¢â€â‚¬Ã¢â€â‚¬ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-modal);
            width: 100%;
            max-width: 480px;
            padding: 28px;
            position: relative;
            animation: modalFadeIn 0.18s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 22px;
            line-height: 1;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }

        .btn-modal-close:hover {
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-main);
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(11, 93, 115, 0.12);
        }

        .btn-submit-milestone {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px;
            font-size: 14.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.15s ease;
        }

        .btn-submit-milestone:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 768px) {
            aside.sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 100;
                margin-left: 0;
                transform: translateX(0);
            }

            aside.sidebar.closed {
                transform: translateX(-100%);
                margin-left: 0;
            }

            .sidebar-backdrop.active {
                display: block;
                position: fixed;
                inset: 0;
                background-color: rgba(15, 23, 42, 0.5);
                backdrop-filter: blur(2px);
                z-index: 99;
            }

            main.main-content {
                padding: 24px 20px;
            }
            .milestones-container {
                padding: 20px;
            }
        }
    </style>
</head>

<div class="modal-overlay" id="milestoneModal" onclick="handleBackdropClick(event)">
    <div class="modal-card">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">Add Milestone</h2>
            <button class="btn-modal-close" onclick="closeModal()" type="button">&times;</button>
        </div>
        <form id="addMilestoneForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="milestoneId">
            <div class="form-group">
                <label class="form-label" for="milestoneName">Milestone Name *</label>
                <input class="form-input" type="text" id="milestoneName" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="milestoneDesc">Description</label>
                <input class="form-input" type="text" id="milestoneDesc">
            </div>
            <div class="form-group">
                <label class="form-label" for="milestoneDate">Target Date</label>
                <input class="form-input" type="date" id="milestoneDate">
            </div>
            <div class="form-group">
                <label class="form-label" for="milestoneStatus">Status</label>
                <select class="form-select" id="milestoneStatus">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="On Hold">On Hold</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <button type="submit" class="btn-submit-milestone" id="btnSubmitMilestone">Add Milestone</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // -- Supabase Config ---
    const SUPABASE_URL = 'https://umdccvvyjyuepmzmqqfn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVtZGNjdnZ5anl1ZXBtem1xcWZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MjA5MTEsImV4cCI6MjEwNTA5NjkxMX0.oLe9xzu-JlpfKQ1oFhKnVUux5XxsgRNEz4btnzFmJqU';
    let db = null;
    try {
        if (window.supabase && window.supabase.createClient) {
            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
    } catch(e) { console.warn('Supabase init failed', e); }

    let allMilestones = [];
    const MILESTONES_STORAGE_KEY = 'cached_milestones_data';

    function loadLocalMilestones() {
        try {
            const raw = localStorage.getItem(MILESTONES_STORAGE_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch(e) { return null; }
    }

    function saveLocalMilestones(list) {
        try {
            localStorage.setItem(MILESTONES_STORAGE_KEY, JSON.stringify(list));
        } catch(e) {}
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        if (dateStr.includes(' ')) return dateStr;
        const parts = dateStr.split('-');
        if (parts.length === 3) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = parts[2].padStart(2, '0');
            const month = months[parseInt(parts[1], 10) - 1] || parts[1];
            const year = parts[0];
            return `${day} ${month} ${year}`;
        }
        return dateStr;
    }

    function toInputDateFormat(dateStr) {
        if (!dateStr || dateStr === 'No date set') return '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
        const parts = dateStr.trim().split(/\s+/);
        if (parts.length === 3) {
            const months = {
                Jan: '01', Feb: '02', Mar: '03', Apr: '04', May: '05', Jun: '06',
                Jul: '07', Aug: '08', Sep: '09', Oct: '10', Nov: '11', Dec: '12'
            };
            const day = parts[0].padStart(2, '0');
            const month = months[parts[1]] || '01';
            const year = parts[2];
            return `${year}-${month}-${day}`;
        }
        return '';
    }

    async function toggleMilestoneStatus(id) {
        const item = allMilestones.find(m => String(m.id) === String(id));
        if (item) {
            const oldStatus = item.status || 'Pending';
            const nextStatus = item.status === 'Completed' ? 'Pending' : 'Completed';
            item.status = nextStatus;
            renderMilestones();
            saveLocalMilestones(allMilestones);

            if (window.AuditLog) {
                AuditLog.log('Status Changed', 'Milestone', item.title || item.name, {
                    field: 'status', from: oldStatus, to: nextStatus
                });
            }

            if (db) {
                try {
                    await db.from('milestones').update({ status: nextStatus }).eq('id', id);
                } catch (err) {
                    console.warn('Toggle status remote notice:', err);
                }
            }
        }
    }

    function renderMilestones() {
        const container = document.getElementById('milestonesTimeline');

        if (allMilestones.length === 0) {
            container.innerHTML = '<div class="empty-milestones">No milestones created yet. Click "+ Add Milestone" to add one.</div>';
            return;
        }

        container.innerHTML = allMilestones.map(m => {
            const isDone = m.status === 'Completed';
            return `
                <div class="timeline-item ${isDone ? 'completed' : ''}">
                    <div class="timeline-status-icon" onclick="toggleMilestoneStatus('${m.id}')" title="Click to toggle status">
                        ${isDone ? `
                            <div class="circle-completed">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                            </div>
                        ` : `
                            <div class="circle-pending"></div>
                        `}
                    </div>
                    <div class="timeline-content">
                        <div class="timeline-header-row">
                            <div class="timeline-title">${escapeHtml(m.title)}</div>
                            <div class="timeline-actions">
                                <button class="btn-action edit" onclick="editMilestone('${m.id}')" title="Edit Milestone">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                </button>
                                <button class="btn-action delete" onclick="deleteMilestone('${m.id}')" title="Delete Milestone">
                                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="timeline-date">${escapeHtml(m.date)}</div>
                        <div class="timeline-desc">${escapeHtml(m.description || '')}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function openAddModal() {
        document.getElementById('addMilestoneForm').reset();
        document.getElementById('milestoneId').value = '';
        document.getElementById('modalTitle').textContent = 'Add Milestone';
        document.getElementById('btnSubmitMilestone').textContent = 'Add Milestone';
        document.getElementById('milestoneModal').classList.add('open');
        setTimeout(() => document.getElementById('milestoneName').focus(), 50);
    }

    function editMilestone(id) {
        const milestone = allMilestones.find(m => String(m.id) === String(id));
        if (!milestone) return;

        document.getElementById('milestoneId').value = milestone.id;
        document.getElementById('milestoneName').value = milestone.title || '';
        document.getElementById('milestoneDesc').value = milestone.description || '';
        document.getElementById('milestoneDate').value = toInputDateFormat(milestone.date);
        document.getElementById('milestoneStatus').value = milestone.status || 'Pending';

        document.getElementById('modalTitle').textContent = 'Edit Milestone';
        document.getElementById('btnSubmitMilestone').textContent = 'Save Changes';
        document.getElementById('milestoneModal').classList.add('open');
        setTimeout(() => document.getElementById('milestoneName').focus(), 50);
    }

    async function deleteMilestone(id) {
        if (!confirm('Are you sure you want to delete this milestone?')) return;
        const milestoneBeingDeleted = allMilestones.find(m => String(m.id) === String(id));
        if (window.AuditLog && milestoneBeingDeleted) {
            AuditLog.log('Deleted', 'Milestone', milestoneBeingDeleted.title || milestoneBeingDeleted.name);
        }
        if (db) {
            try {
                await db.from('milestones').delete().eq('id', id);
            } catch (err) {
                console.warn('Delete milestone remote notice:', err);
            }
        }
        allMilestones = allMilestones.filter(m => String(m.id) !== String(id));
        saveLocalMilestones(allMilestones);
        renderMilestones();
    }

    function closeModal() {
        document.getElementById('milestoneModal').classList.remove('open');
    }

    function closeAddModal() {
        closeModal();
    }

    function handleBackdropClick(e) {
        if (e.target.id === 'milestoneModal') {
            closeModal();
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    async function handleFormSubmit(e) {
        e.preventDefault();
        const id = document.getElementById('milestoneId').value;
        const title = document.getElementById('milestoneName').value.trim();
        const description = document.getElementById('milestoneDesc').value.trim();
        const rawDate = document.getElementById('milestoneDate').value;
        const status = document.getElementById('milestoneStatus').value;

        if (!title) return;

        const btn = document.getElementById('btnSubmitMilestone');
        btn.disabled = true;

        const milestoneData = {
            title,
            description,
            date: rawDate ? formatDate(rawDate) : 'No date set',
            status
        };

        try {
            if (id) {
                if (db) {
                    try {
                        await db.from('milestones').update(milestoneData).eq('id', id);
                    } catch (e) { console.warn('Supabase update notice:', e); }
                }
                const idx = allMilestones.findIndex(m => String(m.id) === String(id));
                if (idx !== -1) allMilestones[idx] = { ...allMilestones[idx], ...milestoneData };
            } else {
                let saved = false;
                if (db) {
                    try {
                        const { data, error } = await db.from('milestones').insert([milestoneData]).select().single();
                        if (!error && data) {
                            allMilestones.push(data);
                            saved = true;
                        }
                    } catch (e) { console.warn('Supabase insert notice:', e); }
                }
                if (!saved) {
                    allMilestones.push({ id: Date.now().toString(), ...milestoneData });
                }
            }
            saveLocalMilestones(allMilestones);
            if (window.AuditLog) {
                AuditLog.log(id ? 'Updated' : 'Created', 'Milestone', title);
            }
            closeModal();
            renderMilestones();
        } catch (err) {
            console.error('Save milestone error:', err);
            alert('Error saving milestone: ' + (err.message || err));
        } finally {
            btn.disabled = false;
        }
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const edgeBtn = document.getElementById('sidebarEdgeToggle');
        const backdrop = document.getElementById('sidebarBackdrop');
        const isClosed = sidebar.classList.toggle('closed');
        if (edgeBtn) {
            edgeBtn.classList.toggle('closed', isClosed);
            edgeBtn.setAttribute('title', isClosed ? 'Open Sidebar' : 'Collapse Sidebar');
        }
        if (backdrop) {
            backdrop.classList.toggle('active', !isClosed && window.innerWidth <= 768);
        }
        localStorage.setItem('sidebar_closed', isClosed);
    }

    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const edgeBtn = document.getElementById('sidebarEdgeToggle');
        const backdrop = document.getElementById('sidebarBackdrop');
        sidebar.classList.add('closed');
        if (edgeBtn) {
            edgeBtn.classList.add('closed');
            edgeBtn.setAttribute('title', 'Open Sidebar');
        }
        if (backdrop) backdrop.classList.remove('active');
        localStorage.setItem('sidebar_closed', 'true');
    }

    function openSidebar() {
        const sidebar = document.getElementById('sidebar');
        const edgeBtn = document.getElementById('sidebarEdgeToggle');
        const backdrop = document.getElementById('sidebarBackdrop');
        sidebar.classList.remove('closed');
        if (edgeBtn) {
            edgeBtn.classList.remove('closed');
            edgeBtn.setAttribute('title', 'Collapse Sidebar');
        }
        if (backdrop && window.innerWidth <= 768) backdrop.classList.add('active');
        localStorage.setItem('sidebar_closed', 'false');
    }


    document.addEventListener('DOMContentLoaded', async () => {
            // Sync project title in sidebar from localStorage
            (function() {
                try {
                    const ap = localStorage.getItem('active_project');
                    if (ap) {
                        const proj = JSON.parse(ap);
                        const brandEl = document.getElementById('sidebar-project-title');
                        if (brandEl && proj.title) brandEl.textContent = proj.title;
                    }
                } catch(e) {}
            })();
        let loaded = false;
        if (db) {
            try {
                const { data, error } = await db.from('milestones').select('*').order('id', { ascending: true });
                if (!error && data && data.length > 0) {
                    allMilestones = data;
                    loaded = true;
                }
            } catch (err) {
                console.warn('Load milestones notice:', err);
            }
        }
        if (!loaded) {
            const cached = loadLocalMilestones();
            allMilestones = cached !== null ? cached : [];
        }
        saveLocalMilestones(allMilestones);
        renderMilestones();
        if (localStorage.getItem('sidebar_closed') === 'true' && window.innerWidth > 768) {
            closeSidebar();
        }
    });
</script>
    <script src="utils/notifications.js"></script>
    <script src="utils/audit-log.js"></script>
</body>

</html>
