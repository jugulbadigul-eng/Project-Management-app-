<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board — Kanban</title>
    <meta name="description"
        content="Kanban-style drag-and-drop task board with Pending, In Progress, and Completed columns.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #0c2d48;
            --sidebar-hover: #145da0;
            --sidebar-active: #0e86d4;
            --sidebar-text: #b1d4e0;
            --sidebar-text-active: #ffffff;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0b5d73;
            --primary-hover: #084758;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --shadow-drag: 0 16px 32px -6px rgba(15, 23, 42, 0.18), 0 0 0 2px var(--primary);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        aside.sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 100vh;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            height: 100vh;
            transition: margin-left 0.25s ease, transform 0.25s ease;
        }

        aside.sidebar.closed {
            margin-left: -260px;
        }

        .sidebar-edge-toggle {
            position: fixed;
            top: 22px;
            left: 246px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--sidebar-bg);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            color: var(--sidebar-text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 60;
            transition: left 0.25s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .sidebar-edge-toggle:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .sidebar-edge-toggle svg {
            transition: transform 0.25s ease;
        }

        .sidebar-edge-toggle.closed {
            left: 12px;
            background-color: #1e293b;
            color: #ffffff;
        }

        .sidebar-edge-toggle.closed svg {
            transform: rotate(180deg);
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(2px);
            z-index: 45;
        }

        .sidebar-top {
            padding: 24px 20px;
        }

        .back-projects-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 20px;
            transition: color 0.15s;
        }

        .back-projects-link:hover {
            color: #ffffff;
        }

        .sidebar-brand {
            color: #ffffff;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: all 0.15s;
        }

        .nav-item a svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .nav-item a:hover {
            color: #ffffff;
            background-color: var(--sidebar-hover);
        }

        .nav-item.active a {
            color: #ffffff;
            background-color: var(--sidebar-active);
            font-weight: 600;
        }

        .sidebar-bottom {
            padding: 18px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .s-avatar {
            width: 34px;
            height: 34px;
            background-color: #334155;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }

        .user-name {
            color: #f1f5f9;
            font-size: 13px;
            font-weight: 600;
        }

        /* Main Content Layout */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
            overflow: hidden;
        }

        .top-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
        }

        .page-title-wrap h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .page-title-wrap p {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 8px 12px 8px 34px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            width: 220px;
            transition: all 0.2s;
            background: #fff;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(11, 93, 115, 0.12);
        }

        .search-box svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            stroke: var(--text-muted);
        }

        .btn-add-task {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-size: 13.5px;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-add-task:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Board Container */
        .board-container {
            flex: 1;
            padding: 24px 32px;
            overflow-x: auto;
            overflow-y: hidden;
            background: #f8fafc;
            display: flex;
            gap: 24px;
        }

        /* Kanban Column */
        .kanban-col {
            flex: 1;
            min-width: 310px;
            max-width: 380px;
            background: #f1f5f9;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid var(--border);
            transition: background 0.2s, border-color 0.2s;
        }

        .kanban-col.drag-over {
            background: #e2e8f0;
            border: 2px dashed var(--primary);
        }

        .col-header {
            padding: 16px 18px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .col-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .col-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .col-pending .col-dot {
            background-color: #f59e0b;
        }

        .col-inprogress .col-dot {
            background-color: #3b82f6;
        }

        .col-completed .col-dot {
            background-color: #10b981;
        }

        .col-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-main);
        }

        .col-badge {
            background: rgba(15, 23, 42, 0.08);
            color: var(--text-main);
            font-size: 11.5px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
        }

        .col-cards {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Task Card */
        .task-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            cursor: grab;
            user-select: none;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            position: relative;
        }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .task-card.dragging {
            opacity: 0.45;
            cursor: grabbing;
            box-shadow: var(--shadow-drag);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .tag-priority {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 3px 8px;
            border-radius: var(--radius-sm);
        }

        .tag-high {
            background: #fee2e2;
            color: #dc2626;
        }

        .tag-medium {
            background: #fef3c7;
            color: #d97706;
        }

        .tag-low {
            background: #e0f2fe;
            color: #0284c7;
        }

        .card-menu-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .card-menu-btn:hover {
            background: #f1f5f9;
            color: #ef4444;
        }

        .card-title {
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.45;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-light);
            padding-top: 10px;
            font-size: 11.5px;
            color: var(--text-muted);
        }

        .card-due {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-due svg {
            width: 13px;
            height: 13px;
        }

        .card-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #cbd5e1;
            color: #1e293b;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Empty state */
        .col-empty {
            text-align: center;
            padding: 28px 12px;
            color: #94a3b8;
            font-size: 12.5px;
            border: 1px dashed #cbd5e1;
            border-radius: var(--radius-md);
            margin-top: 4px;
        }

        /* Add Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(2px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-card h3 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--primary);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .btn-submit {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <a href="dashboard.html" class="back-projects-link">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                Dashboard
            </a>
            <div class="sidebar-brand" id="sidebar-project-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="18" height="18" x="3" y="3" rx="2" />
                    <path d="M9 3v18" />
                    <path d="M15 3v18" />
                </svg>
                Project Hub
            </div>
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="dashboard.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        Overview
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="task-board.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect width="18" height="18" x="3" y="3" rx="2" />
                            <path d="M9 3v18" />
                            <path d="M15 3v18" />
                        </svg>
                        Task Board
                    </a>
                </li>
                <li class="nav-item">
                    <a href="milestones.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                        Milestones
                    </a>
                </li>
            </ul>
        </div>
        <div class="sidebar-bottom">
            <div class="user-info">
                <div class="s-avatar">JD</div>
                <div class="user-name">John Doe</div>
            </div>
        </div>
    </aside>
    <button class="sidebar-edge-toggle" id="sidebarEdgeToggle" onclick="toggleSidebar()" title="Toggle Sidebar"
        type="button" aria-label="Toggle Sidebar">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="15" height="15">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
        </svg>
    </button>

    <!-- Main Content -->
    <div class="main-wrapper">
        <header class="top-bar">
            <div class="page-title-wrap">
                <h1>Task Board</h1>
                <p>Drag and drop cards across columns to update task progress</p>
            </div>
            <div class="top-bar-right">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                    <input type="text" id="taskSearch" placeholder="Filter tasks..." oninput="handleSearch()">
                </div>
                <button class="btn-add-task" onclick="openAddTaskModal()">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    Add Task
                </button>
            </div>
        </header>

        <!-- Board Container (Pending -> In Progress -> Completed) -->
        <main class="board-container">
            <!-- Pending Column -->
            <div class="kanban-col col-pending" id="col-pending" ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'pending')">
                <div class="col-header">
                    <div class="col-title-group">
                        <span class="col-dot"></span>
                        <h2 class="col-title">Pending</h2>
                    </div>
                    <span class="col-badge" id="badge-pending">0</span>
                </div>
                <div class="col-cards" id="cards-pending"></div>
            </div>

            <!-- In Progress Column -->
            <div class="kanban-col col-inprogress" id="col-in_progress" ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'in_progress')">
                <div class="col-header">
                    <div class="col-title-group">
                        <span class="col-dot"></span>
                        <h2 class="col-title">In Progress</h2>
                    </div>
                    <span class="col-badge" id="badge-in_progress">0</span>
                </div>
                <div class="col-cards" id="cards-in_progress"></div>
            </div>

            <!-- Completed Column -->
            <div class="kanban-col col-completed" id="col-completed" ondragover="handleDragOver(event)"
                ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'completed')">
                <div class="col-header">
                    <div class="col-title-group">
                        <span class="col-dot"></span>
                        <h2 class="col-title">Completed</h2>
                    </div>
                    <span class="col-badge" id="badge-completed">0</span>
                </div>
                <div class="col-cards" id="cards-completed"></div>
            </div>
        </main>
    </div>

    <!-- Add Task Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-card">
            <h3>Add New Task</h3>
            <form id="taskForm" onsubmit="handleCreateTask(event)">
                <div class="form-group">
                    <label>Task Title</label>
                    <input type="text" id="taskTitle" required placeholder="e.g. Design authentication workflow">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="taskDesc" rows="3"
                        placeholder="Brief details about what needs to be done..."></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="taskStatus">
                            <option value="pending" selected>Pending</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="taskDue">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeAddTaskModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Kanban Drag-and-Drop & State Logic -->
    <script>
        const STORAGE_KEY = 'kanban_tasks_data';

        const defaultTasks = [
            {
                id: 'task-1',
                title: 'Design database schema',
                desc: 'Set up Supabase tables, foreign keys, and indexes for project entities.',
                priority: 'high',
                status: 'pending',
                dueDate: 'Oct 02',
                avatar: 'DB'
            },
            {
                id: 'task-2',
                title: 'Build drag-and-drop task board',
                desc: 'Implement HTML5 drag and drop events with Pending, In Progress, and Completed states.',
                priority: 'medium',
                status: 'in_progress',
                dueDate: 'Oct 05',
                avatar: 'HL'
            },
            {
                id: 'task-3',
                title: 'Configure auth middleware',
                desc: 'Set up route guard protecting dashboard pages and session refresh.',
                priority: 'low',
                status: 'completed',
                dueDate: 'Sep 27',
                avatar: 'JD'
            }
        ];

        let tasks = [];
        let draggedTaskId = null;
        let searchQuery = '';

        function loadTasks() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    tasks = JSON.parse(raw);
                } catch (e) {
                    tasks = [...defaultTasks];
                }
            } else {
                tasks = [...defaultTasks];
                saveTasks();
            }
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function renderBoard() {
            const columns = {
                pending: document.getElementById('cards-pending'),
                in_progress: document.getElementById('cards-in_progress'),
                completed: document.getElementById('cards-completed')
            };

            const badges = {
                pending: document.getElementById('badge-pending'),
                in_progress: document.getElementById('badge-in_progress'),
                completed: document.getElementById('badge-completed')
            };

            // Clear columns
            Object.values(columns).forEach(col => col.innerHTML = '');

            const counts = { pending: 0, in_progress: 0, completed: 0 };

            const filteredTasks = tasks.filter(t => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                return t.title.toLowerCase().includes(q) || (t.desc && t.desc.toLowerCase().includes(q));
            });

            filteredTasks.forEach(task => {
                if (counts[task.status] !== undefined) {
                    counts[task.status]++;
                }

                const card = document.createElement('div');
                card.className = 'task-card';
                card.draggable = true;
                card.id = task.id;

                card.innerHTML = `
                    <div class="card-top">
                        <span class="tag-priority tag-${task.priority}">${task.priority}</span>
                        <button class="card-menu-btn" title="Delete Task" onclick="deleteTask('${task.id}', event)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    </div>
                    <div class="card-title">${escapeHtml(task.title)}</div>
                    ${task.desc ? `<div class="card-desc">${escapeHtml(task.desc)}</div>` : ''}
                    <div class="card-footer">
                        <div class="card-due">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            ${task.dueDate || 'No due date'}
                        </div>
                        <div class="card-avatar">${task.avatar || 'ME'}</div>
                    </div>
                `;

                // Drag event listeners on card
                card.addEventListener('dragstart', (e) => {
                    draggedTaskId = task.id;
                    card.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', task.id);
                    e.dataTransfer.effectAllowed = 'move';
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    draggedTaskId = null;
                    document.querySelectorAll('.kanban-col').forEach(col => col.classList.remove('drag-over'));
                });

                if (columns[task.status]) {
                    columns[task.status].appendChild(card);
                }
            });

            // Update badges & show empty state if column has 0 cards
            ['pending', 'in_progress', 'completed'].forEach(status => {
                badges[status].textContent = counts[status];
                if (counts[status] === 0) {
                    columns[status].innerHTML = `<div class="col-empty">No tasks in this column</div>`;
                }
            });
        }

        // Drag & Drop Handlers on Columns
        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e, targetStatus) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const taskId = e.dataTransfer.getData('text/plain') || draggedTaskId;

            if (!taskId) return;

            const targetTask = tasks.find(t => t.id === taskId);
            if (targetTask && targetTask.status !== targetStatus) {
                targetTask.status = targetStatus;
                saveTasks();
                renderBoard();
            }
        }

        // Modal Controls
        function openAddTaskModal() {
            document.getElementById('taskModal').classList.add('active');
            document.getElementById('taskTitle').focus();
        }

        function closeAddTaskModal() {
            document.getElementById('taskModal').classList.remove('active');
            document.getElementById('taskForm').reset();
        }

        function handleCreateTask(e) {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value.trim();
            const desc = document.getElementById('taskDesc').value.trim();
            const priority = document.getElementById('taskPriority').value;
            const status = document.getElementById('taskStatus').value;
            const dueVal = document.getElementById('taskDue').value;

            let formattedDue = 'No date';
            if (dueVal) {
                const dateObj = new Date(dueVal);
                formattedDue = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }

            const newTask = {
                id: 'task-' + Date.now(),
                title,
                desc,
                priority,
                status,
                dueDate: formattedDue,
                avatar: 'ME'
            };

            tasks.unshift(newTask);
            saveTasks();
            renderBoard();
            closeAddTaskModal();
        }

        function deleteTask(id, event) {
            event.stopPropagation();
            if (confirm('Delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderBoard();
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById('taskSearch').value;
            renderBoard();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            renderBoard();
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const edgeBtn = document.getElementById('sidebarEdgeToggle');
            const backdrop = document.getElementById('sidebarBackdrop');
            const isClosed = sidebar.classList.toggle('closed');
            if (edgeBtn) {
                edgeBtn.classList.toggle('closed', isClosed);
                edgeBtn.setAttribute('title', isClosed ? 'Open Sidebar' : 'Collapse Sidebar');
            }
            if (backdrop) {
                backdrop.classList.toggle('active', !isClosed && window.innerWidth <= 768);
            }
            localStorage.setItem('sidebar_closed', isClosed);
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const edgeBtn = document.getElementById('sidebarEdgeToggle');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar) sidebar.classList.add('closed');
            if (edgeBtn) {
                edgeBtn.classList.add('closed');
                edgeBtn.setAttribute('title', 'Open Sidebar');
            }
            if (backdrop) backdrop.classList.remove('active');
            localStorage.setItem('sidebar_closed', 'true');
        }

        function openSidebar() {
            const sidebar = document.getElementById('sidebar');
            const edgeBtn = document.getElementById('sidebarEdgeToggle');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar) sidebar.classList.remove('closed');
            if (edgeBtn) {
                edgeBtn.classList.remove('closed');
                edgeBtn.setAttribute('title', 'Collapse Sidebar');
            }
            if (backdrop && window.innerWidth <= 768) backdrop.classList.add('active');
            localStorage.setItem('sidebar_closed', 'false');
        }

        (function initSidebar() {
            const isClosed = localStorage.getItem('sidebar_closed') === 'true';
            if (isClosed && window.innerWidth > 768) {
                closeSidebar();
            }
        })();
    </script>
</body>

</html>
