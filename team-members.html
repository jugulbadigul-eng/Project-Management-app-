<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="Viewport" Content="width=device-width,
initial-scale=1.0">
    <title> Team Members - Project Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #0c2d48;
            --sidebar-hover: #145da0;
            --sidebar-active: #0e86d4;
            --sidebar-text: #b1d4e0;
            --sidebar-text-active: #ffffff;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-sub: #94a3b8;
            --primary: #0b5d73;
            --primary-hover: #08495a;
            --primary-soft: #e0f2fe;
            --primary-avatar-text: #0369a1;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        /* Sidebar Styling */
        aside.sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 100vh;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 20;
            transition: margin-left 0.25s ease, transform 0.25s ease;
        }

        aside.sidebar.closed {
            margin-left: -260px;
        }

        .sidebar-edge-toggle {
            position: fixed;
            top: 22px;
            left: 246px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: var(--sidebar-bg);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            color: var(--sidebar-text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 60;
            transition: left 0.25s ease, background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .sidebar-edge-toggle:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .sidebar-edge-toggle svg {
            transition: transform 0.25s ease;
        }

        .sidebar-edge-toggle.closed {
            left: 12px;
            background-color: #1e293b;
            color: #ffffff;
        }

        .sidebar-edge-toggle.closed svg {
            transform: rotate(180deg);
        }

        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(2px);
            z-index: 45;
        }

        .sidebar-top {
            padding: 24px 20px;
        }

        .back-projects-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 18px;
            transition: color 0.2s ease;
        }

        .back-projects-link:hover {
            color: #cbd5e1;
        }

        .sidebar-brand {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 28px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
        }

        .nav-item a svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            opacity: 0.8;
        }

        .nav-item a:hover {
            color: #ffffff;
            background-color: var(--sidebar-hover);
        }

        .nav-item.active a {
            color: var(--sidebar-text-active);
            background-color: var(--sidebar-active);
            font-weight: 600;
        }

        .nav-item.active a svg {
            opacity: 1;
        }

        .sidebar-bottom {
            padding: 18px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .avatar {
            width: 34px;
            height: 34px;
            background-color: #334155;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }

        .user-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #f1f5f9;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-sidebar-logout {
            background: none;
            border: none;
            color: var(--sidebar-text);
            cursor: pointer;
            padding: 6px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }

        .btn-sidebar-logout:hover {
            color: #ef4444;
        }

        .btn-sidebar-logout svg {
            width: 18px;
            height: 18px;
        }

        main.main-content {
            flex: 1;
            padding: 36px 48px 60px;
            min-width: 0;
            overflow-y: auto;
        }


        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .btn-add-member {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .btn-add-member:hover {
            background-color: var(--primary-hover);
        }

        .btn-add-member:active {
            transform: scale(0.98);
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,
                    minmax(300px, 320px));
            gap: 20px;

        }

        .member-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px 24px;
            box-shadow: var(--shadow-card);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .member-header {

            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .member-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--primary-soft);
            color: var(--primary-avatar-text);
            font-size: 17px;
            ;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .member-details {
            flex: 1;
            min-width: 0;
        }

        .member-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
        }

        .btn-card-action {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.15s ease;
        }

        .btn-card-action svg {
            width: 15px;
            height: 15px;
        }

        .btn-card-action.edit:hover {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .btn-card-action.delete:hover {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .member-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
        }

        .member-role {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 2px;
        }

        .member-contacts {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 4px;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12.5px;
            color: var(--text-muted);
            word-break: break-all;
        }

        .contact-row svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            color: var(--text-sub);
        }

        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }


        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-modal);
            width: 100%;
            max-width: 480px;
            padding: 28px;
            position: relative;
            animation: modalFadeIn 0.18s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 20px;
            line-height: 1;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }


        .btn-modal-close:hover {
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-main);
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(11, 93, 115, 0.12);
        }

        .form-input::placeholder {
            color: var(--text-sub);
        }

        .btn-submit-member {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px;
            font-size: 14.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.15s ease;
        }

        .btn-submit-member:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            aside.sidebar {
                width: 100%;
                height: auto;
                min-height: unset;
                position: relative;
            }

            main.main-content {
                padding: 24px 20px;
            }

            .members-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        let db = null;
        try {
            if (window.supabase && window.supabase.createClient) {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch(e) { console.warn('Supabase init failed', e); }

        const MEMBERS_STORAGE_KEY = 'cached_team_members_data';
        const defaultTeamMembers = [
            { id: '1', name: 'Alice Johnson', role: 'Project Manager', email: 'alice@example.com', phone: '+1 555-0101' },
            { id: '2', name: 'Sarah Brown', role: 'UX Designer', email: 'sarah@example.com', phone: '+1 555-0102' }
        ];
        function loadLocalMembers() {
            try {
                const raw = localStorage.getItem(MEMBERS_STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch(e) { return []; }
        }
        function saveLocalMembers(list) {
            try {
                localStorage.setItem(MEMBERS_STORAGE_KEY, JSON.stringify(list));
            } catch(e) {}
        }

        let members = [];
        function getInitial(name) {
            return name ? name.trim().charAt(0).toUpperCase() : '?';
        }
        function renderMembers() {
            const grid = document.getElementById('membersGrid');
            if (members.length === 0) {
                grid.innerHTML = `<div class="empty-state">No team members added yet. Click "+ Add Member" to get started.</div>`;
                return;
            }
            grid.innerHTML = members.map(m => `
                <div class="member-card">
                    <div class="member-header">
                        <div class="member-avatar">${getInitial(m.name)}</div>
                        <div class="member-details">
                            <div class="member-name">${escapeHtml(m.name)}</div>
                            <div class="member-role">${escapeHtml(m.role || 'Team Member')}</div>
                        </div>
                        <div class="member-actions">
                            <button class="btn-card-action edit" onclick="editMember('${m.id}')" title="Edit Member">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button class="btn-card-action delete" onclick="deleteMember('${m.id}')" title="Delete Member">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="member-contacts">
                        ${m.email ? `
                            <div class="contact-row">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                                <span>${escapeHtml(m.email)}</span>
                            </div>
                        ` : ''}
                        ${m.phone ? `
                            <div class="contact-row">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                                <span>${escapeHtml(m.phone)}</span>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function openAddModal() {
            document.getElementById('addMemberForm').reset();
            document.getElementById('memberId').value = '';
            document.getElementById('modalTitle').textContent = 'Add Team Member';
            document.getElementById('btnSubmitMember').textContent = 'Add Member';
            document.getElementById('memberModal').classList.add('open');
            setTimeout(() => document.getElementById('memberName').focus(), 50);
        }

        function editMember(id) {
            const member = members.find(m => m.id == id);
            if (!member) return;

            document.getElementById('memberId').value = member.id;
            document.getElementById('memberName').value = member.name || '';
            document.getElementById('memberEmail').value = member.email || '';
            document.getElementById('memberRole').value = member.role || '';
            document.getElementById('memberPhone').value = member.phone || '';

            document.getElementById('modalTitle').textContent = 'Edit Team Member';
            document.getElementById('btnSubmitMember').textContent = 'Save Changes';
            document.getElementById('memberModal').classList.add('open');
            setTimeout(() => document.getElementById('memberName').focus(), 50);
        }

        async function deleteMember(id) {
            if (!confirm('Are you sure you want to delete this team member?')) return;
            if (db) {
                try {
                    await db.from('team_members').delete().eq('id', id);
                } catch (err) {
                    console.warn('Delete member remote notice:', err);
                }
            }
            members = members.filter(m => m.id != id);
            saveLocalMembers(members);
            renderMembers();
        }

        function closeAddModal() {
            document.getElementById('memberModal').classList.remove('open');
        }

        function handleBackdropClick(e) {
            if (e.target.id === 'memberModal') {
                closeAddModal();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeAddModal();
            }
        });

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('memberId').value;
            const name = document.getElementById('memberName').value.trim();
            const email = document.getElementById('memberEmail').value.trim();
            const role = document.getElementById('memberRole').value.trim();
            const phone = document.getElementById('memberPhone').value.trim();

            if (!name) return;

            const memberData = { name, email, role, phone };
            const btn = document.getElementById('btnSubmitMember');
            btn.disabled = true;

            try {
                if (id) {
                    if (db) {
                        try {
                            await db.from('team_members').update(memberData).eq('id', id);
                        } catch (e) { console.warn('Supabase update notice:', e); }
                    }
                    const idx = members.findIndex(m => m.id == id);
                    if (idx !== -1) members[idx] = { ...members[idx], ...memberData };
                } else {
                    let saved = false;
                    if (db) {
                        try {
                            const { data, error } = await db.from('team_members').insert([memberData]).select().single();
                            if (!error && data) {
                                members.push(data);
                                saved = true;
                            }
                        } catch (e) { console.warn('Supabase insert notice:', e); }
                    }
                    if (!saved) {
                        members.push({ id: Date.now().toString(), ...memberData });
                    }
                }
                saveLocalMembers(members);
                closeAddModal();
                renderMembers();
            } catch (err) {
                console.error('Save member error:', err);
                alert('Error saving member: ' + (err.message || err));
            } finally {
                btn.disabled = false;
            }
        }



        document.addEventListener('DOMContentLoaded', async () => {
            // Sync project title in sidebar from localStorage
            (function() {
                try {
                    const ap = localStorage.getItem('active_project');
                    if (ap) {
                        const proj = JSON.parse(ap);
                        const brandEl = document.getElementById('sidebar-project-title');
                        if (brandEl && proj.title) brandEl.textContent = proj.title;
                    }
                } catch(e) {}
            })();
            let loaded = false;
            if (db) {
                try {
                    const { data, error } = await db.from('team_members').select('*').order('id', { ascending: true });
                    if (!error && data && data.length > 0) {
                        members = data;
                        loaded = true;
                    }
                } catch (err) {
                    console.warn('Load members remote notice:', err);
                }
            }
            if (!loaded) {
                const cached = loadLocalMembers(); members = (cached && cached.length > 0) ? cached : [...defaultTeamMembers];
            }
            renderMembers();
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const edgeBtn = document.getElementById('sidebarEdgeToggle');
            const backdrop = document.getElementById('sidebarBackdrop');
            const isClosed = sidebar.classList.toggle('closed');
            if (edgeBtn) {
                edgeBtn.classList.toggle('closed', isClosed);
                edgeBtn.setAttribute('title', isClosed ? 'Open Sidebar' : 'Collapse Sidebar');
            }
            if (backdrop) {
                backdrop.classList.toggle('active', !isClosed && window.innerWidth <= 768);
            }
            localStorage.setItem('sidebar_closed', isClosed);
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const edgeBtn = document.getElementById('sidebarEdgeToggle');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar) sidebar.classList.add('closed');
            if (edgeBtn) {
                edgeBtn.classList.add('closed');
                edgeBtn.setAttribute('title', 'Open Sidebar');
            }
            if (backdrop) backdrop.classList.remove('active');
            localStorage.setItem('sidebar_closed', 'true');
        }

        function openSidebar() {
            const sidebar = document.getElementById('sidebar');
            const edgeBtn = document.getElementById('sidebarEdgeToggle');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar) sidebar.classList.remove('closed');
            if (edgeBtn) {
                edgeBtn.classList.remove('closed');
                edgeBtn.setAttribute('title', 'Collapse Sidebar');
            }
            if (backdrop && window.innerWidth <= 768) backdrop.classList.add('active');
            localStorage.setItem('sidebar_closed', 'false');
        }

        (function initSidebar() {
            const isClosed = localStorage.getItem('sidebar_closed') === 'true';
            if (isClosed && window.innerWidth > 768) {
                closeSidebar();
            }
        })();
    </script>
</body>

</html>
